<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memo</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div id="titlebar-drag">
          <img id="app-icon" src="./icon.png" alt="" width="16" height="16" />
          <span id="app-title">Memo</span>
          <span id="doc-title"></span>
        </div>
        <div id="window-controls">
          <button id="btn-min" class="wc-btn" aria-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button id="btn-max" class="wc-btn" aria-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          </button>
          <button id="btn-close" class="wc-btn wc-close" aria-label="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0L10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </header>

      <nav id="menubar">
        <button class="menu-btn" data-menu="file">File</button>
        <button class="menu-btn" data-menu="edit">Edit</button>
        <button class="menu-btn" data-menu="view">View</button>
      </nav>
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="new-tab" class="new-tab-btn" aria-label="New tab">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 0v12M0 6h12" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>

      <main id="editor-wrap">
        <textarea id="editor" spellcheck="false" wrap="soft"></textarea>
      </main>
    </div>

    <div id="menu-popups" class="hidden"></div>

    <div id="toast" class="hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
